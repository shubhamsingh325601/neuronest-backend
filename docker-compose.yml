# Local Postgres for development and e2e tests.
# The app itself is not containerised in this phase — run it with `npm run start:dev`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: neuronest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuronest
      POSTGRES_PASSWORD: neuronest
      POSTGRES_DB: neuronest
    ports:
      - '5432:5432'
    volumes:
      - neuronest-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neuronest -d neuronest']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neuronest-pgdata:
